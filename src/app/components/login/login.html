<div class="login-wrapper">
  <!-- 🟢 CONTENEDOR FLEXIBLE CENTRAL HORIZONTAL -->
  <div class="v2-login-flex-row">
    <!-- Tarjeta con Efecto Cristal 3D -->
    <div class="login-card">
      <div class="login-header">
        <div class="logo-circle">⚡</div>
        <h2>SigoCartera <span class="cyan-text">V2</span></h2>
        <p class="subtitle">Gestión y Auditoría de Saldos Multimoneda</p>
      </div>

      <form class="login-form" (ngSubmit)="ejecutarAutenticacionV2()">
        <!-- Input 1: Correo -->
        <div class="input-group-v2">
          <label>📧 Correo Institucional</label>
          <input
            type="email"
            placeholder="ejemplo@sigo.com"
            [(ngModel)]="credenciales.correo"
            name="correo"
            required
          />
        </div>

        <!-- Input 2: Contraseña -->
        <div class="input-group-v2">
          <label>🔑 Contraseña de Acceso</label>
          <input
            type="password"
            placeholder="••••••••••••"
            [(ngModel)]="credenciales.password"
            name="password"
            required
          />
        </div>

        <div class="form-actions">
          <label class="checkbox-container">
            <input type="checkbox" [(ngModel)]="recordarSesion" name="remember" />
            <span>Recordar sesión</span>
          </label>
          <a href="javascript:void(0)" class="forgot-link">¿Olvidó su contraseña?</a>
        </div>

        <button type="submit" class="btn-submit-v2">Autenticar Sistema</button>
      </form>

      <div class="test-roles-box-v2">
        <div class="title-test">ROLES COMPATIBLES PARA PRUEBAS:</div>
        <div>• <strong>Admin:</strong> <code>admin@sigo.com</code> | <code>Sigo2026!</code></div>
        <div class="mt-1">
          • <strong>Gestor:</strong> <code>gestor@sigo.com</code> | <code>Cobros2026!</code>
        </div>
      </div>
    </div>

    <!-- 🟢 EL TOAST SE COLOCA A LA DERECHA EN PARALELO EXACTO -->
    @if (mostrarMensajeExito()) {
      <div class="v2-toast-embedded-holder">
        <app-login-toast></app-login-toast>
      </div>
    }
  </div>
</div>

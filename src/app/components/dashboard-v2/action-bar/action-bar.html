<div class="v2-action-cards-row">
  <!-- Micro-Card 1: Modificar -->
  <button type="button" class="v2-action-card border-outline-glow">
    <span class="action-icon">🔧</span>
    <div class="action-text-wrapper">
      <span class="action-title">Modificar</span>
      <span class="action-desc">Ficha Entidad</span>
    </div>
  </button>

  <!-- Micro-Card 2: Abonar -->
  <button type="button" class="v2-action-card border-success-glow">
    <span class="action-icon text-success">💵</span>
    <div class="action-text-wrapper">
      <span class="action-title text-success">Abonar</span>
      <span class="action-desc">Ingresar Pago</span>
    </div>
  </button>

  <!-- Micro-Card 3: Registrar -->
  <button type="button" class="v2-action-card border-primary-glow">
    <span class="action-icon text-primary">➕</span>
    <div class="action-text-wrapper">
      <span class="action-title text-primary">Registrar</span>
      <span class="action-desc">Nueva Factura</span>
    </div>
  </button>

  <!-- Micro-Card 4: Excel -->
  <button type="button" class="v2-action-card border-excel-glow">
    <span class="action-icon text-emerald">📥</span>
    <div class="action-text-wrapper">
      <span class="action-title text-emerald">Excel</span>
      <span class="action-desc">Exportar Pool</span>
    </div>
  </button>
